[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "brightspace-sync"
dynamic = ["version"]
description = "Retrieve your own Brightspace course material into a local folder."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Vazquez" }]
keywords = ["brightspace", "d2l", "lms", "backup", "courses", "student", "retrieve", "api"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = [
  "requests>=2.31",
  "rookiepy>=0.5.6",    # reads browser cookies incl. Chrome 127+ app-bound (v20) on Windows
  "PyYAML>=6.0",
  "yt-dlp>=2024.1.1",   # lecture-video downloads (used only when include.videos: true)
  "pywebview>=5.3,<7",  # sign-in window fallback when the browser-cookie read fails; <7 = opt in to the next major deliberately (get_cookies() shape has moved before)
]

[project.scripts]
brightspace-sync = "brightspace_sync.cli:main"

[project.urls]
Homepage = "https://github.com/Jightning/brightspace-sync"
Issues = "https://github.com/Jightning/brightspace-sync/issues"

[tool.hatch.version]
path = "brightspace_sync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["brightspace_sync"]

[tool.hatch.build.targets.sdist]
include = ["/brightspace_sync", "/config.example.yaml", "/README.md", "/LICENSE"]
